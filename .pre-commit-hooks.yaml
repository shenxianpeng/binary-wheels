# Same hooks as upstream, but `language: python`: pre-commit installs the tool's
# wheel from PyPI instead of compiling it with a Go toolchain.
# The `name==version` pins below are updated by `binwheel bump`.
- id: gitleaks
  name: Detect hardcoded secrets
  description: Detect hardcoded secrets using Gitleaks
  entry: gitleaks git --pre-commit --redact --staged --verbose
  language: python
  additional_dependencies: ["gitleaks==8.30.1"]
  pass_filenames: false

# osv-scanner hook: added back once an osv-scanner wheel is on PyPI.
