name: Check upstream releases

# Once a day, look for new upstream releases. For each one: pin it, build the
# wheel for this runner, run it, and open a pull request with a before/after
# summary. Merging the pull request publishes it (publish.yml).
#
# Repository setting needed: Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: list
        run: echo "tools=$(uv run binwheel list --json)" >> "$GITHUB_OUTPUT"

  bump:
    needs: tools
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.tools) }}
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the pull request
      actions: write # dispatch CI on the bump branch
    env:
      GH_TOKEN: ${{ github.token }}
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - id: bump
        run: |
          echo "old=$(uv run binwheel version "$TOOL")" >> "$GITHUB_OUTPUT"
          uv run binwheel bump "$TOOL"

      - id: branch
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="bump/${TOOL}-${VERSION}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}" "$branch" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and run the new version before proposing it
        if: steps.bump.outputs.changed == 'true' && steps.branch.outputs.exists != 'true'
        run: |
          uv run binwheel build "$TOOL" --host -o dist
          uv run binwheel smoke "$TOOL" --dist dist --require

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true' && steps.branch.outputs.exists != 'true'
        env:
          OLD: ${{ steps.bump.outputs.old }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add tools .pre-commit-hooks.yaml
          git commit -m "chore(${TOOL}): bump to ${VERSION}"
          git push "https://github.com/${GITHUB_REPOSITORY}" "HEAD:refs/heads/${BRANCH}"

          {
            echo "Upstream released ${TOOL} ${VERSION}."
            echo
            echo "| | Before | After |"
            echo "|---|---|---|"
            echo "| \`${TOOL}\` on PyPI | \`${OLD}\` | \`${VERSION}\` |"
            echo
            echo "Pinned sha256 of the upstream files (review against the upstream release):"
            echo
            echo '```diff'
            git diff HEAD~1 -- "tools/${TOOL}.lock.json"
            echo '```'
            echo
            echo "Checked in this run: the linux x86_64 wheel was built from these files, installed into a fresh venv and run."
            echo "Full CI (all platforms, containers, pre-commit hooks) runs on this branch. Merging publishes to PyPI."
          } > body.md
          gh pr create --head "$BRANCH" --title "chore(${TOOL}): bump to ${VERSION}" --body-file body.md
          gh workflow run ci.yml --ref "$BRANCH"
