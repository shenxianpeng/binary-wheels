name: Publish

# Merging a bump pull request (a change under tools/) publishes every tool whose
# pinned version is not on PyPI yet. Nothing is published twice, so re-running
# this workflow is safe.
on:
  push:
    branches: [main]
    paths: ["tools/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.plan.outputs.tools }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: plan
        run: uv run binwheel plan

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - env:
          TOOL: ${{ matrix.tool }}
        run: |
          uv run binwheel build "$TOOL" -o dist
          uv run twine check --strict dist/*.whl
          uv run binwheel extras "$TOOL" -o extras
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.tool }}
          path: |
            dist/*.whl
            extras/
          if-no-files-found: error

  pypi:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    # On PyPI, add a trusted publisher for each project: this repository,
    # workflow publish.yml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.tool }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-${{ matrix.tool }}
          path: artifact
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifact/dist/
          # PEP 740 attestations are on by default with trusted publishing

  github-release:
    needs: [plan, pypi]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-${{ matrix.tool }}
          path: artifact
      - name: Tag <tool>-v<version> and attach the wheels (and any source tarball)
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ matrix.tool }}
        run: |
          version="$(uv run binwheel version "$TOOL")"
          tag="${TOOL}-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          shopt -s nullglob
          gh release create "$tag" artifact/dist/*.whl artifact/extras/* \
            --target "$GITHUB_SHA" \
            --title "$TOOL $version" \
            --notes "Wheels for upstream $TOOL $version, published to https://pypi.org/project/$TOOL/$version/"
