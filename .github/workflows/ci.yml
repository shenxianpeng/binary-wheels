name: CI

on:
  pull_request:
  push:
    branches: [main]
  # check-upstream.yml dispatches this on its bump branches, because pull requests
  # opened with GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run pytest -q

  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: list
        run: echo "tools=$(uv run binwheel list --json)" >> "$GITHUB_OUTPUT"

  build:
    needs: tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build wheels (downloads are checked against the pinned sha256)
        env:
          TOOL: ${{ matrix.tool }}
        run: uv run binwheel build "$TOOL" -o dist
      - run: uv run twine check --strict dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.tool }}
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: python -m pip install packaging
      - name: Install each tool's wheel for this runner in a fresh venv and run it
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m binwheel.cli smoke --dist dist

  # musl (Alpine) and an old glibc (Debian 11, glibc 2.31). JavaScript actions do not
  # run in Alpine containers, so these call docker directly.
  smoke-containers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: "python:3.13-alpine" }
          - { runner: ubuntu-24.04-arm, image: "python:3.13-alpine" }
          - { runner: ubuntu-latest, image: "python:3.13-slim-bullseye" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/repo:ro" "$IMAGE" sh /repo/scripts/container-smoke.sh

  pre-commit-hooks:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: python -m pip install pre-commit
      - name: Hooks install from the wheels and catch a leak and a vulnerable dependency
        env:
          # pre-commit's pip picks the not-yet-published wheels up from here
          PIP_FIND_LINKS: ${{ github.workspace }}/dist
        run: |
          set -u
          repo="$GITHUB_WORKSPACE"
          work="$(mktemp -d)" && cd "$work"
          git init -q && git config user.email ci@example.invalid && git config user.name ci
          echo 'token = "ghp_1a2B3c4D5e6F7g8H9i0J1k2L3m4N5o6P7q8R"' > leak.py
          echo 'requests==2.19.0' > requirements.txt
          git add -A

          if pre-commit try-repo "$repo" gitleaks; then echo "::error::gitleaks hook missed the leak"; exit 1; fi
          if pre-commit try-repo "$repo" osv-scanner --all-files; then echo "::error::osv-scanner hook missed the vulnerability"; exit 1; fi

          git rm -q --cached leak.py requirements.txt && rm leak.py requirements.txt
          echo 'print("hello")' > ok.py && git add ok.py
          pre-commit try-repo "$repo" gitleaks
